name: Fetch Data & Deploy to GitHub Pages

on:
  #schedule:
    # Run every hour
    #- cron: "0 * * * *"
  workflow_dispatch: # Allow manual trigger
  push:
    branches: [main, master]
    paths:
      - "frontend/**"
      - "scripts/**"
      - ".github/workflows/deploy-gh-pages.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Restore previously fetched data from the data branch (if it exists)
      - name: Restore existing data
        run: |
          git fetch origin data-store --depth=1 || true
          if git rev-parse origin/data-store >/dev/null 2>&1; then
            git checkout origin/data-store -- frontend/public/data/incidents.json || true
            echo "Restored existing data"
          else
            echo "No existing data branch found, starting fresh"
          fi

      - name: Fetch police log data
        run: node scripts/fetch-data.mjs --districts sor-vest --merge

      # Save data to a dedicated branch for persistence across runs
      - name: Persist data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          DATA_FILE="frontend/public/data/incidents.json"
          if [ ! -f "$DATA_FILE" ]; then
            echo "No data file to persist"
            exit 0
          fi

          # Copy data to a temp location outside git
          TMPFILE=$(mktemp)
          cp "$DATA_FILE" "$TMPFILE"

          # Stash any other in-progress changes and remember current branch
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)

          # Build the data branch cleanly using a fresh worktree
          WORKTREE=$(mktemp -d)
          git worktree add --orphan -b data-store-work "$WORKTREE"

          # Populate worktree with just the data file
          mkdir -p "$WORKTREE/frontend/public/data"
          cp "$TMPFILE" "$WORKTREE/frontend/public/data/incidents.json"

          cd "$WORKTREE"
          git add frontend/public/data/incidents.json
          if git diff --cached --quiet; then
            echo "No data changes to persist"
          else
            git commit -m "Update incident data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:data-store --force
          fi

          cd "$GITHUB_WORKSPACE"
          git worktree remove --force "$WORKTREE"
          git branch -D data-store-work 2>/dev/null || true
          rm -f "$TMPFILE"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (static mode)
        working-directory: frontend
        env:
          VITE_STATIC_DATA: "true"
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
